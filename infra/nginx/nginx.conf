# Nginx Configuration File
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    include /etc/nginx/conf.d/*.conf;
}
