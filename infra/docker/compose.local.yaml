services:
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    init: true
    environment:
      MP_DATABASE: /tmp/mailpit.db
    expose:
      - "1025"
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  identity:
    depends_on:
      mailpit:
        condition: service_healthy
        restart: true

  nginx:
    ports: !override
      - "127.0.0.1:${HTTPS_PORT:-443}:8443"
