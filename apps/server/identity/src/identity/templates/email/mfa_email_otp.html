<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your security verification code</title>
  </head>
  <body style="margin: 0; padding: 24px; background-color: #f5f5f5; color: #202020; font-family: Arial, sans-serif;">
    <main style="max-width: 560px; margin: 0 auto; padding: 24px; background-color: #ffffff;">
      <h1 style="font-size: 24px;">Your security verification code</h1>
      <p>Enter this code to complete your security check:</p>
      <p style="padding: 16px; background-color: #f5f5f5; font-size: 28px; letter-spacing: 6px;"><code>${token}</code></p>
      <p>This code can only be used once. Do not share it with anyone.</p>
      <p>If you did not request this code, you can ignore this email.</p>
    </main>
  </body>
</html>
