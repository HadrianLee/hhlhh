<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your password</title>
  </head>
  <body style="margin: 0; padding: 24px; background-color: #f5f5f5; color: #202020; font-family: Arial, sans-serif;">
    <main style="max-width: 560px; margin: 0 auto; padding: 24px; background-color: #ffffff;">
      <h1 style="font-size: 24px;">Reset your password</h1>
      <p><a href="${reset_url}" style="display: inline-block; padding: 12px 20px; background-color: #24583d; color: #ffffff; text-decoration: none; border-radius: 6px;">Reset password</a></p>
      <p>This link can only be used once. Do not share it with anyone.</p>
      <p>If you did not request a password reset, you can ignore this email.</p>
    </main>
  </body>
</html>
